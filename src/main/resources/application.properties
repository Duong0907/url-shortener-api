spring.application.name=url-shortener-api
# Local credentials live in .env (git-ignored). See .env.example.
spring.config.import=optional:file:.env[.properties]
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.url=${DATABASE_URL:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
management.endpoints.web.base-path=/
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl=PT15M
app.refresh-token.ttl=P30D
app.refresh-token.cookie-secure=${COOKIE_SECURE:true}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.ui-base-url=${UI_BASE_URL:http://localhost:3000}
app.verification.ttl=PT24H
app.mail.from=${MAIL_FROM:no-reply@urlshortener.local}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
# Sending is synchronous, so a hung SMTP server must not hang the request.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# A mail outage must not mark the whole app as DOWN: registration survives it (user can resend).
management.health.mail.enabled=false
