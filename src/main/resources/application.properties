spring.application.name=url-shortener-api
# Local credentials live in .env (git-ignored). See .env.example.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/urlshortener}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
management.endpoints.web.base-path=/
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl=PT15M
app.refresh-token.ttl=P30D
app.refresh-token.cookie-secure=${COOKIE_SECURE:true}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
